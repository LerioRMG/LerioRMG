<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEACHUB · Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#111116;color:#f8f5f7;font:15px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:30px}h2{margin-top:30px}small{color:#bcb2ba}section,.card{background:#1d1b22;border:1px solid #39313b;border-radius:16px;padding:18px;margin:12px 0}input,textarea,select,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #5a4c59;background:#151318;color:#fff}input,textarea{width:100%}input[type=checkbox]{width:auto}button{background:#efaeca;color:#20131b;font-weight:700;border:0;cursor:pointer}button.secondary{background:#39313b;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row input{width:auto}label{display:block;margin:8px 0}label span{display:block;margin-bottom:5px;color:#ded5dc}textarea{min-height:75px}.drop{display:block;border:2px dashed #a46d89;border-radius:12px;padding:22px;text-align:center;cursor:pointer;margin:12px 0}.drop input{margin-top:10px}.status{position:sticky;bottom:10px;background:#322631;padding:10px;border-radius:8px}a{color:#efaeca}@media(max-width:600px){main{padding:14px}button{min-height:44px}}
</style></head><body><main><h1>PEACHUB <small>admin</small></h1><div id="login"><section><h2>Accedi</h2><form id="loginForm"><label><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label><button>Entra</button></form></section></div><div id="app" hidden><div class="row"><button id="refresh" class="secondary">Aggiorna</button><button id="logout" class="secondary">Esci</button></div><section><h2>Nuova creator</h2><form id="newCreator" class="grid"><label><span>Nome</span><input name="name" required></label><label><span>Slug</span><input name="slug" pattern="[a-z0-9-]+" required></label><button>Aggiungi</button></form><small>Le nuove creator partono disattivate.</small></section><h2>Creator e contenuti</h2><div id="creators"></div><section><h2>Pubblicità</h2><form id="newAd" class="grid"><label><span>Titolo</span><input name="title" required></label><label><span>Link HTTPS</span><input type="url" name="url" required></label><label><input type="checkbox" name="active"> Attiva</label><label><input type="checkbox" name="approved"> Approvata</label><button>Aggiungi annuncio</button></form><div id="ads"></div></section></div><p id="status" class="status" role="status"></p></main><script>
let csrf='',state={creators:[],media:[],ads:[]};const $=s=>document.querySelector(s),status=t=>$('#status').textContent=t;
async function api(url,opt={}){opt.headers={...(opt.headers||{})};if(opt.method&&opt.method!=='GET'&&url!='/admin/login')opt.headers['x-csrf-token']=csrf;let r=await fetch(url,opt);if(!r.ok){let x;try{x=await r.json()}catch{}throw Error(x?.detail||'Operazione non riuscita')}return r.status===204?null:r.json()}
async function load(){try{csrf=(await api('/admin/session')).csrf;state=await api('/admin/data');$('#login').hidden=true;$('#app').hidden=false;render();status('')}catch(e){$('#login').hidden=false;$('#app').hidden=true}}
function el(tag,text){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}function check(label,checked){let l=el('label'),i=el('input');i.type='checkbox';i.checked=!!checked;l.append(i,document.createTextNode(' '+label));return [l,i]}
function render(){let root=$('#creators');root.replaceChildren();state.creators.forEach(c=>{let box=el('section'),h=el('h3',c.name+' · @'+(c.username||c.slug)),row=el('div');row.className='row';let [a,active]=check('Creator attiva',c.active),[p,clips]=check('Peach Clips attivo',c.clips_enabled),boost=el('select');for(let i=1;i<=5;i++){let o=el('option','Priorità '+i);o.value=i;o.selected=+c.boost===i;boost.append(o)}let save=el('button','Salva');let bio=el('textarea');bio.value=c.bio||'';bio.placeholder='Biografia';let fields=el('div');fields.className='grid';let inputs={};[['username','Username'],['onlyfans_url','Link OnlyFans'],['instagram_url','Link Instagram'],['telegram_url','Link Telegram']].forEach(([key,label])=>{let l=el('label'),x=el('input');l.append(el('span',label));x.value=c[key]||'';l.append(x);fields.append(l);inputs[key]=x});save.onclick=async()=>{try{await api('/admin/creator',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:c.id,name:c.name,slug:c.slug,bio:bio.value,username:inputs.username.value,onlyfans_url:inputs.onlyfans_url.value,instagram_url:inputs.instagram_url.value,telegram_url:inputs.telegram_url.value,active:active.checked,clips_enabled:clips.checked,boost:+boost.value})});status('Creator salvata')}catch(e){status(e.message)}};row.append(a,p,boost,save);box.append(h,row,bio,fields);
let form=el('form'),drop=el('label','Trascina foto e video qui, oppure seleziona i file');drop.className='drop';let input=el('input');input.type='file';input.multiple=true;input.accept='image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm';drop.append(input);['dragenter','dragover'].forEach(k=>drop.addEventListener(k,e=>{e.preventDefault()}));drop.addEventListener('drop',e=>{e.preventDefault();input.files=e.dataTransfer.files});let send=el('button','Carica file');form.append(drop,send);form.onsubmit=async e=>{e.preventDefault();if(!input.files.length)return;let data=new FormData();data.append('creator_id',c.id);for(let f of input.files)data.append('files',f);try{status('Caricamento in corso…');await api('/admin/upload',{method:'POST',body:data});await load();status('File caricati, da attivare e approvare')}catch(x){status(x.message)}};box.append(form);
state.media.filter(m=>m.creator_id===c.id).forEach(m=>{let line=el('div');line.className='card';line.append(el('small',(m.kind==='video'?'Video':'Foto')+' · '+m.path));if(m.kind==='image'){let img=el('img');img.src='/admin/media/'+m.id+'/preview';img.alt='Anteprima';img.style.cssText='display:block;width:90px;height:90px;object-fit:cover;border-radius:8px;margin-top:8px';line.append(img)}let controls=el('div');controls.className='row';let [x,on]=check('Attivo',m.active),[y,ok]=check('Approvato',m.approved),[z,cl]=check('Peach Clips',m.clip_enabled);if(m.kind!=='video')cl.disabled=true;let caption=el('input');caption.placeholder='Didascalia';caption.value=m.caption||'';line.append(caption);let b=el('button','Salva file');b.onclick=async()=>{try{await api('/admin/media/'+m.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:on.checked,approved:ok.checked,clip_enabled:cl.checked,caption:caption.value})});status('File salvato')}catch(e){status(e.message)}};controls.append(x,y,z,b);line.append(controls);box.append(line)});root.append(box)});let ads=$('#ads');ads.replaceChildren();state.ads.forEach(a=>{let row=el('div');row.className='row';let [l,on]=check(a.title+' · attiva',a.active),[k,ok]=check('Approvata',a.approved),button=el('button','Salva');button.onclick=async()=>{try{await api('/admin/ads/'+a.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:on.checked,approved:ok.checked})});status('Annuncio salvato')}catch(e){status(e.message)}};row.append(l,k,button);ads.append(row)})}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/admin/login',{method:'POST',body:new FormData(e.target)});e.target.reset();await load()}catch(x){status(x.message)}};$('#newCreator').onsubmit=async e=>{e.preventDefault();let d=new FormData(e.target);try{await api('/admin/creator',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:d.get('name'),slug:d.get('slug'),boost:1})});e.target.reset();await load()}catch(x){status(x.message)}};$('#newAd').onsubmit=async e=>{e.preventDefault();let d=new FormData(e.target);try{await api('/admin/ads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:d.get('title'),url:d.get('url'),active:d.has('active'),approved:d.has('approved')})});e.target.reset();await load()}catch(x){status(x.message)}};$('#refresh').onclick=load;$('#logout').onclick=async()=>{try{await api('/admin/logout',{method:'POST'});await load()}catch(e){status(e.message)}};load();
</script></body></html>
