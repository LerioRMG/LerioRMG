function creatorCard(p){const img=p.image&&/^\/api\/image\/\d+$/.test(p.image)?'<img loading="lazy" decoding="async" src="'+safeText(p.image)+'" alt="">':'';return '<article class="card person"><a href="#/creator/'+encodeURIComponent(p.slug)+'"><div class="photo">'+img+'</div><span class="tag">PEACH WIKI · CREATOR</span><h3>'+safeText(p.name)+'</h3></a><p class="muted">'+safeText((p.excerpt||p.bio||'').slice(0,140))+'</p><a class="pink" href="#/creator/'+encodeURIComponent(p.slug)+'">Scopri la creator</a></article>'}
function saraCard(){return creators.slice(0,4).map(creatorCard).join('')||'<p class="muted">Le schede creator saranno disponibili a breve.</p>'}
function creatorPage(slug){if(!creatorsLoaded)return '<div class="empty"><p>Caricamento creator…</p></div>';const p=creators.find(x=>x.slug===slug);if(!p)return notfound();const photos=(p.images||[]).filter(x=>/^\/api\/image\/\d+$/.test(x));const cover=photos[0]?'<img class="profile-cover" src="'+safeText(photos[0])+'" alt="Foto di '+safeText(p.name)+'">':'<div class="profile-placeholder" aria-hidden="true">✦</div>';const gallery=photos.slice(1).map(x=>'<img loading="lazy" src="'+safeText(x)+'" alt="Foto di '+safeText(p.name)+'">').join('');const videos=(p.videos||[]).filter(v=>v&&/^\/api\/creator-video\/\d+$/.test(v.src)).map(v=>'<figure class="creator-video"><video controls playsinline preload="metadata" src="'+safeText(v.src)+'"></video>'+(v.caption?'<figcaption>'+safeText(v.caption)+'</figcaption>':'')+'</figure>').join('');const tags=tagList(p).map(t=>'<span>'+safeText(t)+'</span>').join('');const social=[['OnlyFans',p.onlyfans_url],['Instagram',p.instagram_url],['Telegram',p.telegram_url]].map(([label,url])=>{try{let u=new URL(url);return u.protocol==='https:'?'<a href="'+safeText(u.href)+'" target="_blank" rel="noopener noreferrer">'+label+' <span aria-hidden="true">↗</span></a>':''}catch{return ''}}).join('');const intro=p.excerpt||'';const bio=p.bio&&p.bio!==intro?p.bio:'';const about=p.about&&p.about!==bio&&p.about!==intro?p.about:'';return '<a class="profile-back" href="#/creators">← Tutte le creator</a><div class="profile-hero"><div class="profile-visual">'+cover+'</div><div class="profile-info"><span class="profile-kicker">PEACH WIKI <span>✦</span> CREATOR</span><h1>'+safeText(p.name)+'</h1>'+(intro?'<p class="profile-intro">'+safeText(intro)+'</p>':'')+(tags?'<div class="wiki-tags">'+tags+'</div>':'')+(social?'<div class="profile-social-label">SEGUI LA CREATOR</div><div class="profile-social">'+social+'</div>':'')+'</div></div>'+(bio||about?'<section class="profile-story"><div><span class="profile-kicker">LA CREATOR</span><h2>Chi è '+safeText(p.name)+'</h2></div><div>'+(bio?'<p>'+safeText(bio)+'</p>':'')+(about?'<p>'+safeText(about)+'</p>':'')+'</div></section>':'')+(gallery?'<section class="profile-section"><div class="profile-section-head"><div><span class="profile-kicker">DA VICINO</span><h2>La sua galleria</h2></div></div><div class="wiki-gallery">'+gallery+'</div></section>':'')+(videos?'<section class="profile-section"><div class="profile-section-head"><div><span class="profile-kicker">GUARDA ORA</span><h2>I suoi video</h2></div><a href="/clips.html">Vai ai Peach Clips ↗</a></div><div class="creator-videos">'+videos+'</div></section>':'')}
function creatorsPage(){const tags=[...new Set(creators.flatMap(tagList))].slice(0,24);return '<span class="eyebrow">PEACH WIKI</span><h1>Creator consigliate</h1><p class="muted">Schede editoriali e collegamenti ufficiali.</p><div class="filters" id="filters"><button data-cat="all" class="active">Tutte</button>'+tags.map(x=>'<button data-cat="'+safeText(encodeURIComponent(x))+'">'+safeText(x)+'</button>').join('')+'</div><div class="cards" id="people"></div>'}
function drawPeople(c){let tag=c==='all'?'':decodeURIComponent(c).toLocaleLowerCase();$('#people').innerHTML=creators.filter(p=>!tag||tagList(p).some(t=>t.toLocaleLowerCase()===tag)).map(creatorCard).join('')||'<div class="empty"><h3>Nessuna creator in questa categoria</h3></div>'}
function clipCards(){return '<div class="clips"><a href="clips.html" class="clip" style="text-decoration:none"><span class="play">▶</span><div><span class="eyebrow">PEACH CLIPS</span><br><b>Video verticali e creator</b><small>Apri il feed, scorri i video e scopri i profili social collegati.</small></div></a><a href="clips.html" class="clip" style="text-decoration:none"><span class="play"></span><div><span class="eyebrow">SCOPRI</span><br><b>Vai a Peach Clips</b><small>Player a tutto schermo, audio e condivisione.</small></div></a></div>'}
function page18(){return '<div class="empty"><span class="eyebrow">Accesso riservato</span><h1>Peach 18+</h1><p>Area disattivata. Prima del lancio serviranno verifica dell’età conforme, controlli sui media, autorizzazioni e hosting idoneo.</p><a class="pink" href="#/">Torna al magazine</a></div>'}
function simple(t){return '<div class="article"><h1>'+t+'</h1><div class="notice">Pagina dimostrativa. Il testo definitivo dovrà essere predisposto e approvato prima della pubblicazione.</div></div>'}
function notfound(){return simple('Pagina non trovata')}
function render(){let route=location.hash.slice(2).split('/'),p=route[0]||'';let v=p===''?home():p==='article'?article(route[1]):p==='creator'?creatorPage(decodeURIComponent(route[1]||'')):p==='creators'?creatorsPage():p==='clips'?'<div class="empty"><h1>Peach Clips</h1><p><a class="pink" href="clips.html">Apri il feed video</a></p></div>':p==='18plus'?page18():p==='search'?'<h1>Cerca nel magazine</h1><input class="search" placeholder="Titolo o parola chiave..." id="q"><div class="cards sec" id="results"></div>':names[p]?archive(p):simple(({contact:'Contatti',collaborations:'Collaborazioni',privacy:'Privacy policy',terms:'Condizioni di utilizzo'})[p]||'Pagina');$('#app').innerHTML=v;if(p==='creators'){$('#filters').onclick=e=>{let c=e.target.dataset.cat;if(!c)return;document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('active',b.dataset.cat===c));drawPeople(c)};drawPeople('all')}if(p==='search')$('#q').oninput=e=>{$('#results').innerHTML=stories.filter(x=>(x.title+' '+x.description).toLowerCase().includes(e.target.value.toLowerCase())).map(card).join('')};$('#head').classList.remove('open');window.PeachI18n?.apply(document);window.scrollTo(0,0)}window.addEventListener('hashchange',render);$('#menubtn').onclick=()=>$('#head').classList.toggle('open');render();fetch('/api/creators').then(r=>{if(!r.ok)throw Error('API unavailable');return r.json()}).then(data=>{creators=Array.isArray(data)?data:[];creatorsLoaded=true;render()}).catch(()=>{creatorsLoaded=true;render()});
</script></body></html>
