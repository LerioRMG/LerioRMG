<script>
const stories=[{"slug":"valentina-nappi-bilancio-societa-produzione-2026","title":"Valentina Nappi e il business del porno","cat":"news","description":"Il bilancio della società legata alla performer e l'industria adult.","date":"21 novembre 2026","cover":"INDUSTRIA ADULT","image":"https://commons.wikimedia.org/wiki/Special:FilePath/Valentina%20Nappi%202016.jpg","imageAlt":"Valentina Nappi all'AVN Expo"},{"slug":"giulia-napolitano-porno-italiano-las-vegas","title":"Giulia Napolitano, dalla Sicilia a Las Vegas","cat":"news","description":"Dall'esperienza su OnlyFans alla scena porno internazionale.","date":"21 novembre 2026","cover":"PERFORMER ITALIANE","image":"https://commons.wikimedia.org/wiki/Special:FilePath/Camera%20Crew.jpg","imageAlt":"Foto di repertorio cinematografico"},{"slug":"hacking-the-porn-premio-2026-video-creator","title":"Hacking The Porn premiato agli IMA 2026","cat":"features","description":"Creator italiane e video adult al centro di una campagna premiata.","date":"21 novembre 2026","cover":"VIDEO & CULTURA","image":"https://commons.wikimedia.org/wiki/Special:FilePath/Camera%20crew%20setting%20everything%20up.jpg","imageAlt":"Foto di repertorio cinematografico"},{"slug":"agcom-verifica-eta-siti-porno-italia-2026","title":"Siti porno e verifica dell'età in Italia","cat":"news","description":"I provvedimenti AGCOM sui siti pornografici nel 2026.","date":"21 novembre 2026","cover":"REGOLE & PIATTAFORME","image":"https://commons.wikimedia.org/wiki/Special:FilePath/AGCOM%20Sede%20di%20Roma%20Via%20Isonzo.jpg","imageAlt":"Sede AGCOM a Roma"}];
const groups=[['creators','Creator consigliate'],['news','Notizie'],['collections','Raccolte'],['picks','Consigli'],['features','Approfondimenti'],['discover','Recupera anche']];
let creators=[];
const names={creators:'Creator consigliate',news:'Notizie',collections:'Compilation e raccolte',picks:'Consigli',features:'Approfondimenti',discover:'Scopri',clips:'Peach Clips'};
const $=s=>document.querySelector(s);
const photo=(i,label)=>'<div class="photo" style="background:linear-gradient('+(120+i*18)+'deg,#'+['533543','25404c','413047','48413c'][i%4]+',#121620)">'+(label||'FOTO DEMO · MEDIA AUTORIZZATI')+'</div>';
function card(a,i){return '<article class="card"><a href="/articoli/'+a.slug+'/"><div class="photo editorial-cover"><img loading="lazy" decoding="async" src="'+a.image+'" alt="'+a.imageAlt+'" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'"><span class="image-label">'+a.cover+'</span></div><span class="tag">'+names[a.cat]+'</span><h3>'+a.title+'</h3></a><span class="muted">'+a.date+' · Redazione PEACHUB</span></article>'}
function sec(id,label,items){return '<section class="sec"><div class="sectop"><h2>'+label+'</h2><a href="#/'+id+'">Vedi tutti</a></div><div class="cards">'+items.map(card).join('')+'</div></section>'}
function home(){return '<div class="lead"><a class="hero news-hero" href="/articoli/'+stories[0].slug+'/"><img src="'+stories[0].image+'" alt="'+stories[0].imageAlt+'" decoding="async" fetchpriority="high" referrerpolicy="no-referrer"><div class="hero-copy"><span class="eyebrow">In primo piano · Notizie</span><h1>'+stories[0].title+'</h1><p>'+stories[0].description+'</p><span class="hero-cta">Leggi l’articolo</span></div></a><div class="teasers">'+stories.slice(1,4).map((a,i)=>'<a href="/articoli/'+a.slug+'/" class="teaser"><div class="thumb news-thumb"><img src="'+a.image+'" alt="'+a.imageAlt+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'"></div><div><span class="tag">'+names[a.cat]+'</span><h3>'+a.title+'</h3><span class="muted">'+a.date+'</span></div></a>').join('')+'</div></div>'+groups.map(([id,label])=>id==='creators'?'<section class="sec"><div class="sectop"><h2>Creator consigliate</h2><a href="#/creators">Vedi tutte</a></div><div class="cards">'+saraCard()+'</div></section>':sec(id,label,stories.filter(s=>s.cat===id))).join('')+'<section class="sec"><div class="sectop"><h2>Peach Clips</h2><a href="clips.html">Tutti i clip</a></div>'+clipCards()+'</section>'}
function archive(cat){let arr=stories.filter(x=>x.cat===cat);return '<div class="split"><div><span class="eyebrow">PEACHUB / '+names[cat]+'</span><h1>'+names[cat]+'</h1><p class="muted">Archivio editoriale, articoli e contenuti correlati.</p><div class="cards">'+arr.map(card).join('')+'</div><p class="muted">Paginazione disponibile quando saranno pubblicati più articoli.</p></div>'+sidebar()+'</div>'}
function sidebar(){return '<aside class="sidebar"><h3>Ultimi articoli</h3>'+stories.map(x=>'<div class="sideitem"><a href="/articoli/'+x.slug+'/">'+x.title+'</a></div>').join('')+'<h3 style="margin-top:28px">Categorie</h3>'+groups.map(x=>'<div class="sideitem"><a href="#/'+x[0]+'">'+x[1]+'</a></div>').join('')+'</aside>'}
function article(id){return '<div class="empty"><h1>Articoli PEACHUB</h1><p>Leggi gli approfondimenti pubblicati nel magazine.</p><div class="cards">'+stories.map(card).join('')+'</div></div>'}
const safeText=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function creatorCard(p){const img=p.image&&/^\/api\/image\/\d+$/.test(p.image)?'<img loading="lazy" decoding="async" src="'+safeText(p.image)+'" alt="">':'';return '<article class="card person"><a href="#/creator/'+encodeURIComponent(p.slug)+'"><div class="photo">'+img+'</div><span class="tag">PEACH WIKI · CREATOR</span><h3>'+safeText(p.name)+'</h3></a><p class="muted">'+safeText((p.bio||'').slice(0,140))+'</p><a class="pink" href="#/creator/'+encodeURIComponent(p.slug)+'">Leggi la scheda</a></article>'}
function saraCard(){return creators.slice(0,4).map(creatorCard).join('')||'<p class="muted">Le schede creator saranno disponibili a breve.</p>'}
function creatorPage(slug){const p=creators.find(x=>x.slug===slug);if(!p)return notfound();const images=(p.images||[]).filter(x=>/^\/api\/image\/\d+$/.test(x)).map(x=>'<img loading="lazy" src="'+safeText(x)+'" alt="" style="width:min(100%,260px);border-radius:12px">').join('');const social=[['OnlyFans',p.onlyfans_url],['Instagram',p.instagram_url],['Telegram',p.telegram_url]].map(([label,url])=>{try{let u=new URL(url);return u.protocol==='https:'?'<a class="pink" href="'+safeText(u.href)+'" target="_blank" rel="noopener noreferrer">'+label+'</a> ':''}catch{return ''}}).join('');return '<div class="article"><span class="eyebrow">PEACH WIKI</span><h1>'+safeText(p.name)+'</h1><div class="grid">'+images+'</div><p>'+safeText(p.bio||'')+'</p><p>'+social+'</p></div>'}
function creatorsPage(){return '<span class="eyebrow">PEACH WIKI</span><h1>Creator consigliate</h1><p class="muted">Schede editoriali delle creator e collegamenti ai profili ufficiali.</p><div class="filters" id="filters">'+['all','brunette','blonde','curvy','no-face','other'].map(x=>'<button data-cat="'+x+'" class="'+(x==='all'?'active':'')+'">'+x+'</button>').join('')+'</div><div class="cards" id="people"></div>'}
function drawPeople(c){$('#people').innerHTML=creators.filter(p=>c==='all'||p.category===c).map(creatorCard).join('')||'<div class="empty"><h3>Nessuna creator in questa categoria</h3><p class="muted">Stiamo aggiungendo nuove schede con materiali autorizzati.</p></div>'}
function clipCards(){return '<div class="clips"><a href="clips.html" class="clip" style="text-decoration:none"><span class="play">▶</span><div><span class="eyebrow">PEACH CLIPS</span><br><b>Video verticali e creator</b><small>Apri il feed, scorri i video e scopri i profili social collegati.</small></div></a><a href="clips.html" class="clip" style="text-decoration:none"><span class="play"></span><div><span class="eyebrow">SCOPRI</span><br><b>Vai a Peach Clips</b><small>Player a tutto schermo, audio e condivisione.</small></div></a></div>'}
function page18(){return '<div class="empty"><span class="eyebrow">Accesso riservato</span><h1>Peach 18+</h1><p>Area disattivata. Prima del lancio serviranno verifica dell’età conforme, controlli sui media, autorizzazioni e hosting idoneo.</p><a class="pink" href="#/">Torna al magazine</a></div>'}
function simple(t){return '<div class="article"><h1>'+t+'</h1><div class="notice">Pagina dimostrativa. Il testo definitivo dovrà essere predisposto e approvato prima della pubblicazione.</div></div>'}
function notfound(){return simple('Pagina non trovata')}
function render(){let route=location.hash.slice(2).split('/'),p=route[0]||'';let v=p===''?home():p==='article'?article(route[1]):p==='creator'?creatorPage(decodeURIComponent(route[1]||'')):p==='creators'?creatorsPage():p==='clips'?'<div class="empty"><h1>Peach Clips</h1><p><a class="pink" href="clips.html">Apri il feed video</a></p></div>':p==='18plus'?page18():p==='search'?'<h1>Cerca nel magazine</h1><input class="search" placeholder="Titolo o parola chiave..." id="q"><div class="cards sec" id="results"></div>':names[p]?archive(p):simple(({contact:'Contatti',collaborations:'Collaborazioni',privacy:'Privacy policy',terms:'Condizioni di utilizzo'})[p]||'Pagina');$('#app').innerHTML=v;if(p==='creators'){$('#filters').onclick=e=>{let c=e.target.dataset.cat;if(!c)return;document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('active',b.dataset.cat===c));drawPeople(c)};drawPeople('all')}if(p==='search')$('#q').oninput=e=>{$('#results').innerHTML=stories.filter(x=>(x.title+' '+x.description).toLowerCase().includes(e.target.value.toLowerCase())).map(card).join('')};$('#head').classList.remove('open');window.PeachI18n?.apply(document);window.scrollTo(0,0)}window.addEventListener('hashchange',render);$('#menubtn').onclick=()=>$('#head').classList.toggle('open');render();fetch('/api/creators').then(r=>{if(!r.ok)throw Error('API unavailable');return r.json()}).then(data=>{creators=Array.isArray(data)?data:[];render()}).catch(()=>{});
</script></body></html>
