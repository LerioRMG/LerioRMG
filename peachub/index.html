<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0e12"><meta name="description" content="PEACHUB: magazine editoriale, interviste, creator, raccolte e Peach Clips."><title>PEACHUB | Magazine, creator e cultura digitale</title>
<style>
:root{--bg:#0b0c10;--surface:#15161a;--line:#303137;--pink:#eab2c9;--ice:#d9f3fa;--white:#fafafa;--muted:#b3b4be}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;line-height:1.5}button,input{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}.wrap{max-width:1210px;margin:auto;padding:0 22px}.head{position:sticky;top:0;z-index:5;background:#0c0d11f4;border-bottom:1px solid var(--line)}.navbar{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{font-size:27px;letter-spacing:-1.8px;font-weight:900;font-style:italic;white-space:nowrap}.logo span{background:var(--pink);border-radius:5px;color:#151117;padding:3px 6px}.navlinks{display:flex;gap:20px;flex-wrap:wrap}.navlinks a{font-size:13px;font-weight:700}.navlinks a:hover,.link{color:var(--pink)}.actions{display:flex;gap:10px}.pill{border:1px solid #4a4b50;border-radius:8px;background:transparent;color:white;padding:9px 12px}.pink{background:var(--pink);color:#20131a;border:0;border-radius:7px;font-weight:800;padding:9px 15px}.page{padding:26px 0 70px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--ice);font-weight:800}.lead{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:22px}.hero{border:1px solid var(--line);border-radius:8px;min-height:340px;display:flex;align-items:end;padding:29px;background:linear-gradient(0deg,#0a0b0ff7 0%,#0a0b0f0a 80%),linear-gradient(125deg,#4a3344,#292e38 52%,#202e37)}.hero h1{font-size:clamp(30px,4vw,53px);line-height:1.08;max-width:690px;margin:12px 0}.hero p{color:#d8d8dc;max-width:570px}.teasers{display:grid;gap:11px}.teaser{display:grid;grid-template-columns:110px 1fr;gap:14px;border-bottom:1px solid var(--line);padding-bottom:12px;align-items:center}.teaser:last-child{border:0}.thumb,.photo{background:linear-gradient(135deg,#604252,#233945 70%,#342b40);border:1px solid #ffffff12}.thumb{border-radius:6px;height:88px}.teaser h3{font-size:15px;margin:4px 0;line-height:1.25}.muted{color:var(--muted);font-size:12px}.sec{margin-top:42px}.sectop{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin-bottom:18px;padding-bottom:9px;gap:12px}.sectop h2{margin:0;font-size:23px}.sectop a{color:var(--pink);font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{min-width:0}.photo{height:165px;border-radius:7px;margin-bottom:9px;display:flex;align-items:end;padding:10px;color:#fff9;font-size:11px}.card h3{font-size:17px;line-height:1.3;margin:6px 0 9px}.card a:hover h3{color:var(--pink)}.tag{font-size:11px;color:var(--ice);text-transform:uppercase;font-weight:800;letter-spacing:.04em}.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,.9fr);gap:28px}.sidebar{border-left:1px solid var(--line);padding-left:24px}.sidebar h3{margin-top:0}.sideitem{padding:14px 0;border-bottom:1px solid var(--line)}.sideitem a:hover{color:var(--pink)}.featuregrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.foot{padding:35px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.foot a{margin-right:18px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 24px}.filters button{border:1px solid var(--line);color:#fff;background:#181a1f;border-radius:20px;padding:7px 13px}.filters button.active{background:var(--pink);color:#101010}.person .photo{height:215px}.article{max-width:780px;margin:auto}.article h1{font-size:clamp(30px,4vw,54px);line-height:1.13}.article p{line-height:1.85;color:#dadbe0}.article .cover{height:330px;border-radius:8px;margin:24px 0}.clips{display:flex;gap:14px;overflow:auto;padding:10px 0 18px;scroll-snap-type:x mandatory}.clip{flex:0 0 216px;height:350px;background:linear-gradient(155deg,#483043,#111923 65%,#0a1016);border:1px solid var(--line);border-radius:12px;display:flex;align-items:end;padding:15px;position:relative;scroll-snap-align:start}.play{position:absolute;top:12px;right:14px;font-size:24px}.clip b{font-size:15px}.clip small{display:block;color:var(--ice)}.notice{border:1px solid var(--line);border-radius:9px;padding:20px;background:var(--surface);color:var(--muted)}.empty{padding:42px;border:1px solid var(--line);border-radius:9px}.search{width:100%;background:#191b20;color:#fff;border:1px solid #45464c;border-radius:7px;padding:12px 14px}.mobilebtn{display:none}@media(max-width:900px){.navlinks{display:none}.mobilebtn{display:block}.lead,.split{grid-template-columns:1fr}.teasers{grid-template-columns:repeat(3,1fr)}.teaser{grid-template-columns:1fr}.sidebar{border-left:0;padding-left:0}.cards{grid-template-columns:repeat(2,1fr)}.featuregrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.logo{font-size:23px}.wrap{padding:0 15px}.lead{gap:16px}.hero{min-height:315px;padding:19px}.teasers{display:grid;grid-template-columns:1fr}.teaser{grid-template-columns:95px 1fr}.thumb{height:70px}.cards{gap:13px}.photo{height:130px}.person .photo{height:190px}.card h3{font-size:15px}.featuregrid{grid-template-columns:1fr}.sectop h2{font-size:20px}.mobilebtn{display:block}.head.open .navlinks{display:flex;position:absolute;top:70px;left:0;right:0;background:#111218;flex-direction:column;padding:20px;border-bottom:1px solid var(--line)}}
</style></head><body>
<header class="head" id="head"><div class="wrap navbar"><a class="logo" href="#/">PEAC<span>HUB</span></a><nav class="navlinks" aria-label="Navigazione"><a href="#/">Home</a><a href="#/creators">Creator consigliate</a><a href="#/news">Notizie</a><a href="#/collections">Raccolte</a><a href="#/picks">Consigli</a><a href="#/features">Approfondimenti</a><a href="#/discover">Scopri</a><a href="clips.html">Peach Clips</a></nav><div class="actions"><button class="pill mobilebtn" id="menubtn" aria-label="Apri menu">☰</button><a class="pill" href="https://t.me/thepeachub" target="_blank" rel="noopener noreferrer">TG ↗</a><a class="pill" href="#/search">⌕</a><a class="pink" href="#/18plus">18+</a></div></div></header>
<main class="wrap page" id="app"></main><footer class="foot"><div class="wrap"><div class="logo">PEAC<span>HUB</span></div><p>Magazine editoriale · Contenuti di esempio in attesa della redazione</p><a href="#/contact">Contatti</a><a href="#/collaborations">Collaborazioni</a><a href="#/privacy">Privacy</a><a href="#/terms">Termini</a><a href="https://t.me/thepeachub" target="_blank" rel="noopener noreferrer">Telegram ufficiale ↗</a></div></footer>
<script>
const stories=[
['Le nuove voci della creator economy','news','Storie, piattaforme e nuove tendenze del settore digitale.'],
['Dietro il profilo: creatività e identità','features','Come si costruisce un’identità online riconoscibile.'],
['Creator spotlight: una nuova intervista','creators','Un modello di intervista editoriale da personalizzare.'],
['Il meglio della settimana','collections','Una raccolta curata dalla redazione Peachub.'],
['Come organizzare contenuti e pubblicazioni','picks','Strumenti e buone pratiche per un calendario editoriale.'],
['Tra community e contenuti originali','discover','Cosa rende autentica una community digitale.'],
['Le tendenze della comunicazione online','news','Un approfondimento sulle novità del momento.'],
['Una storia da raccontare','features','Intervista e ritratto editoriale di una creator.'],
['Selezione creator del mese','collections','Nuovi profili e progetti da scoprire.'],
['Una guida alle collaborazioni','picks','Trasparenza, autorizzazioni e promozione responsabile.'],
['Peach Wiki: la scheda editoriale','creators','La presentazione completa di una creator.'],
['Scopri nuove prospettive','discover','Approfondimenti, cultura digitale e community.']
].map((a,i)=>({id:i+1,title:a[0],cat:a[1],description:a[2],slug:i+1,read:3+(i%5)}));
const groups=[['creators','Creator consigliate'],['news','Notizie'],['collections','Raccolte'],['picks','Consigli'],['features','Approfondimenti'],['discover','Recupera anche']];
const creators=[['Creator Spotlight','brunette'],['Nuova protagonista','blonde'],['Studio Portrait','curvy'],['Mystery Creator','no-face']].map((a,i)=>({id:i+1,name:a[0],category:a[1]}));
const names={creators:'Creator consigliate',news:'Notizie',collections:'Compilation e raccolte',picks:'Consigli',features:'Approfondimenti',discover:'Scopri',clips:'Peach Clips'};
const $=s=>document.querySelector(s);
const photo=(i,label)=>'<div class="photo" style="background:linear-gradient('+(120+i*18)+'deg,#'+['533543','25404c','413047','48413c'][i%4]+',#121620)">'+(label||'FOTO DEMO · MEDIA AUTORIZZATI')+'</div>';
function card(a,i){return '<article class="card"><a href="#/article/'+a.id+'">'+photo(i)+'<span class="tag">'+names[a.cat]+'</span><h3>'+a.title+'</h3></a><span class="muted">'+a.read+' min · Contenuto dimostrativo</span></article>'}
function sec(id,label,items){return '<section class="sec"><div class="sectop"><h2>'+label+'</h2><a href="#/'+id+'">Vedi tutti →</a></div><div class="cards">'+items.map(card).join('')+'</div></section>'}
function home(){return '<div class="lead"><div class="hero"><div><span class="eyebrow">In primo piano · Magazine</span><h1>Il mondo dei creator, raccontato da vicino.</h1><p>Interviste, notizie, approfondimenti e nuove storie dalla creator economy.</p><a class="pink" href="#/article/1">Leggi l’articolo →</a></div></div><div class="teasers">'+stories.slice(0,3).map((s,i)=>'<a href="#/article/'+s.id+'" class="teaser"><div class="thumb"></div><div><span class="tag">'+names[s.cat]+'</span><h3>'+s.title+'</h3><span class="muted">'+s.read+' min</span></div></a>').join('')+'</div></div>'+
groups.map(([id,label])=>sec(id,label,stories.filter(s=>s.cat===id))).join('')+
'<section class="sec"><div class="sectop"><h2>Peach Clips</h2><a href="clips.html">Tutti i clip →</a></div>'+clipCards()+'</section>'}
function archive(cat){let arr=stories.filter(x=>x.cat===cat);return '<div class="split"><div><span class="eyebrow">PEACHUB / '+names[cat]+'</span><h1>'+names[cat]+'</h1><p class="muted">Archivio editoriale, articoli e contenuti correlati.</p><div class="cards">'+arr.map(card).join('')+'</div><p class="muted">Paginazione disponibile quando saranno pubblicati più articoli.</p></div>'+sidebar()+'</div>'}
function sidebar(){return '<aside class="sidebar"><h3>Ultimi articoli</h3>'+stories.slice(0,6).map(x=>'<div class="sideitem"><a href="#/article/'+x.id+'">'+x.title+'</a></div>').join('')+'<h3 style="margin-top:28px">Categorie</h3>'+groups.map(x=>'<div class="sideitem"><a href="#/'+x[0]+'">'+x[1]+'</a></div>').join('')+'</aside>'}
function article(id){let s=stories.find(x=>x.id==id);if(!s)return notfound();return '<article class="article"><a class="link" href="#/'+s.cat+'">← '+names[s.cat]+'</a><p class="eyebrow">'+names[s.cat]+'</p><h1>'+s.title+'</h1><p>'+s.description+'</p><p class="muted">Redazione Peachub · Testo dimostrativo · '+s.read+' min di lettura</p><div class="photo cover"></div><h2>Un magazine dedicato alle storie</h2><p>Questa è una pagina dimostrativa del futuro CMS editoriale. Il contenuto effettivo verrà inserito e verificato dalla redazione, con immagini e autorizzazioni prima della pubblicazione.</p><h2>Scopri altri articoli</h2><div class="cards">'+stories.filter(x=>x.id!=id).slice(0,2).map(card).join('')+'</div></article>'}
function creatorsPage(){return '<span class="eyebrow">PEACH WIKI</span><h1>Creator consigliate</h1><p class="muted">Profili dimostrativi: nessuna persona reale rappresentata.</p><div class="filters" id="filters">'+['all','brunette','blonde','curvy','no-face','other'].map(x=>'<button data-cat="'+x+'" class="'+(x==='all'?'active':'')+'">'+x+'</button>').join('')+'</div><div class="cards" id="people"></div>'}
function drawPeople(c){$('#people').innerHTML=creators.filter(p=>c==='all'||p.category===c).map((p,i)=>'<div class="card person">'+photo(i) +'<span class="tag">'+p.category+'</span><h3>'+p.name+'</h3><p class="muted">Scheda dimostrativa · Link non attivo</p></div>').join('')||'<p>Nessuna creator in questa categoria.</p>'}
function clipCards(){return '<a href="clips.html" class="clip" style="text-decoration:none"><span class="play">▶</span><div><span class="eyebrow">PEACH CLIPS</span><br><b>Video verticali e creator</b><small>Apri il feed, scorri i video e scopri i profili social collegati.</small></div></a><a href="clips.html" class="clip" style="text-decoration:none"><span class="play">↗</span><div><span class="eyebrow">SCOPRI</span><br><b>Vai a Peach Clips</b><small>Player a tutto schermo, audio e condivisione.</small></div></a>'}
function page18(){return '<div class="empty"><span class="eyebrow">Accesso riservato</span><h1>Peach 18+</h1><p>Area disattivata. Prima del lancio serviranno verifica dell’età conforme, controlli sui media, autorizzazioni e hosting idoneo.</p><a class="pink" href="#/">Torna al magazine</a></div>'}
function simple(t){return '<div class="article"><h1>'+t+'</h1><div class="notice">Pagina dimostrativa. Il testo definitivo dovrà essere predisposto e approvato prima della pubblicazione.</div></div>'}
function notfound(){return simple('Pagina non trovata')}
function render(){let route=location.hash.slice(2).split('/'),p=route[0]||'';let v=p===''?home():p==='article'?article(route[1]):p==='creators'?creatorsPage():p==='clips'?'<div class="empty"><h1>Peach Clips</h1><p><a class="pink" href="clips.html">Apri il feed video →</a></p></div>':p==='18plus'?page18():p==='search'?'<h1>Cerca nel magazine</h1><input class="search" placeholder="Titolo o parola chiave..." id="q"><div class="cards sec" id="results"></div>':names[p]?archive(p):simple(({contact:'Contatti',collaborations:'Collaborazioni',privacy:'Privacy policy',terms:'Condizioni di utilizzo'})[p]||'Pagina');$('#app').innerHTML=v;if(p==='creators'){$('#filters').onclick=e=>{let c=e.target.dataset.cat;if(!c)return;document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('active',b.dataset.cat===c));drawPeople(c)};drawPeople('all')}if(p==='search')$('#q').oninput=e=>{$('#results').innerHTML=stories.filter(x=>x.title.toLowerCase().includes(e.target.value.toLowerCase())).map(card).join('')};$('#head').classList.remove('open');window.scrollTo(0,0)}window.addEventListener('hashchange',render);$('#menubtn').onclick=()=>$('#head').classList.toggle('open');render();
</script></body></html>
