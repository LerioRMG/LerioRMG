t:70px;border-radius:50%;background:#222632;color:var(--pink)}.empty-play svg{width:33px;height:33px}a:focus-visible,button:focus-visible{outline:2px solid var(--ice);outline-offset:3px}@media(max-width:550px){.clips-header{height:58px;padding:0 12px}.clips-header .brand img{width:125px}.clips-title{font-size:10px;letter-spacing:.08em}.telegram-link{padding:7px;min-height:38px}.telegram-link span{display:none}.telegram-link img{width:21px;height:21px}.controls{right:11px;gap:12px}.controls button{width:44px;height:44px}.controls button svg{width:21px;height:21px}.info{right:77px}.info a.social-link{padding:7px 9px;font-size:11px}}</style><script src="/cookie.js" defer></script></head><body><header class="clips-header"><a href="/" class="brand" aria-label="PEACHUB homepage"><img src="/logo.svg" alt="PEACHUB" width="158" height="38"></a><span class="clips-title">PEACH CLIPS</span><a class="toplink telegram-link" href="https://t.me/thepeachub" target="_blank" rel="noopener noreferrer" aria-label="Telegram ufficiale PEACHUB"><img src="/telegram.svg" alt="" width="21" height="21"><span>Telegram</span></a></header><main id="feed" class="viewport" aria-label="Feed Peach Clips"></main><div id="notice" class="notice off" role="status"></div>
<script>
"use strict";
const UI={
play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>',
pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>',
mute:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/><path d="m17 9 5 6m0-6-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
sound:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/><path d="M16 9c2 1.5 2 4.5 0 6m2-9c4.3 3 4.3 9 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>',
share:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m0 0L7 8m5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>',
next:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15m0 0-6-6m6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>'
};
const FEED=document.getElementById("feed"),NOTICE=document.getElementById("notice");
let clips=[],active=-1,observer=null,previewUrl=null,loading=false;
const safeUrl=(value)=>{try{const u=new URL(value,location.href);return u.protocol==="https:"||u.origin===location.origin&&u.protocol==="http:"?u.href:null}catch{return null}};
const escapeHTML=(v)=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const socialDetails={instagram:["Instagram","/instagram.svg"],x:["X","/x.svg"],telegram:["Telegram","/telegram.svg"],onlyfans:["OnlyFans","https://commons.wikimedia.org/wiki/Special:FilePath/Tabler-icons%20brand-onlyfans.svg"],profile:["Profilo",null]};
const links=(c)=>["instagram","x","telegram","onlyfans","profile"].filter(k=>safeUrl(c[k])).map(k=>{const m=socialDetails[k];return '<a class="social-link social-'+k+'" target="_blank" rel="noopener noreferrer" href="'+escapeHTML(safeUrl(c[k]))+'">'+(m[1]?'<img src="'+m[1]+'" alt="" width="19" height="19">':'')+'<span>'+m[0]+'</span></a>'}).join("");
function toast(msg){NOTICE.textContent=msg;NOTICE.classList.remove("off");setTimeout(()=>NOTICE.classList.add("off"),2400)}
function empty(){FEED.innerHTML='<section class="empty"><div class="emptybox"><div class="empty-play">'+UI.play+'</div><h1>Peach Clips</h1><p>Il feed verticale è pronto. Non ci sono ancora video pubblicati. Puoi provarlo immediatamente selezionando un video dal telefono: sarà riprodotto soltanto sul tuo dispositivo, senza caricarlo sul server.</p><label class="upload">Prova un video locale<input type="file" id="localvideo" accept="video/*"></label><p class="hint">Per pubblicare video per tutti, aggiungi i file autorizzati sul server e le relative voci in <code>clips.json</code>.</p><p><a href="/" style="color:var(--pink)">Torna al magazine</a></p></div></section>';document.getElementById("localvideo").addEventListener("change",e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith("video/")){toast("Seleziona un video valido");return}if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(f);clips=[{id:"local",src:previewUrl,creator:"Anteprima locale",caption:"Video visibile solo su questo dispositivo",local:true}];draw()})}
function validItem(c){return c&&typeof c==="object"&&typeof c.creator==="string"&&typeof c.src==="string"&&safeUrl(c.src)&&!c.explicit&&c.approved===true}
function draw(){if(observer)observer.disconnect();if(!clips.length){empty();return}FEED.innerHTML=clips.map((c,i)=>'<section class="slide paused" data-index="'+i+'"><video playsinline preload="'+(i===0?"metadata":"none")+'" '+(c.poster&&safeUrl(c.poster)?'poster="'+escapeHTML(safeUrl(c.poster))+'"':"")+' src="'+escapeHTML(c.src)+'" loop muted></video><div class="gradient"></div><button class="playoverlay" aria-label="Riproduci o metti in pausa"><span class="middle">'+UI.play+'</span></button><div class="info"><b>@'+escapeHTML(c.creator)+'</b><p>'+escapeHTML(c.caption||"")+'</p>'+links(c)+'</div><div class="controls"><button class="togglemute" aria-label="Attiva audio">'+UI.mute+'</button><button class="share" aria-label="Condividi clip">'+UI.share+'</button><button class="next" aria-label="Clip successivo">'+UI.next+'</button></div><div class="timeline"><span></span></div></section>').join("");
FEED.querySelectorAll(".slide").forEach(slide=>{const video=slide.querySelector("video");slide.querySelector(".playoverlay").onclick=()=>video.paused?video.play().catch(()=>toast("Tocca per riprodurre")):video.pause();slide.querySelector(".togglemute").onclick=e=>{video.muted=!video.muted;e.currentTarget.innerHTML=video.muted?UI.mute:UI.sound;e.currentTarget.setAttribute("aria-label",video.muted?"Attiva audio":"Disattiva audio")};slide.querySelector(".next").onclick=()=>FEED.querySelectorAll(".slide")[Math.min(+slide.dataset.index+1,clips.length-1)].scrollIntoView({behavior:"smooth"});slide.querySelector(".share").onclick=async()=>{const c=clips[+slide.dataset.index];const url=c.local?location.href:location.href.split("#")[0]+"#"+encodeURIComponent(c.id||slide.dataset.index);if(navigator.share){try{await navigator.share({title:"Peach Clips",url})}catch{}}else if(navigator.clipboard){try{await navigator.clipboard.writeText(url);toast("Link copiato")}catch{toast("Impossibile copiare il link")}}};video.onplay=()=>{slide.classList.remove("paused");slide.querySelector(".middle").innerHTML=UI.pause};video.onpause=()=>{slide.classList.add("paused");slide.querySelector(".middle").innerHTML=UI.play};video.ontimeupdate=()=>{slide.querySelector(".timeline span").style.width=(video.duration?video.currentTime/video.duration*100:0)+"%"};video.onerror=()=>toast("Video non disponibile: controlla il file e il formato")});
observer=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>=.65){const i=+e.target.dataset.index;if(active!==i){FEED.querySelectorAll(".slide video").forEach((v,j)=>{if(i!==j){v.pause();v.currentTime=0}});active=i;const v=e.target.querySelector("video");v.preload="auto";v.play().catch(()=>{});const next=FEED.querySelectorAll(".slide video")[i+1];if(next)next.preload="metadata"}}})},{root:FEED,threshold:[.65]});FEED.querySelectorAll(".slide").forEach(s=>observer.observe(s));}
document.addEventListener("keydown",e=>{if(!clips.length)return;if(["ArrowDown","ArrowUp"," "].includes(e.key))e.preventDefault();const slides=[...FEED.querySelectorAll(".slide")];if(e.key==="ArrowDown")slides[Math.min(active+1,slides.length-1)]?.scrollIntoView({behavior:"smooth"});if(e.key==="ArrowUp")slides[Math.max(active-1,0)]?.scrollIntoView({behavior:"smooth"});if(e.key===" "){const v=slides[Math.max(active,0)]?.querySelector("video");if(v)v.paused?v.play().catch(()=>{}):v.pause()}});
document.addEventListener("visibilitychange",()=>{if(document.hidden)FEED.querySelectorAll("video").forEach(v=>v.pause())});
(async()=>{if(loading)return;loading=true;try{const r=await fetch("clips.json",{cache:"no-store"});if(!r.ok)throw Error("Manifest non disponibile");const data=await r.json();clips=(Array.isArray(data)?data:[]).filter(validItem).map(c=>({...c,src:safeUrl(c.src)}));draw();if(clips.length&&location.hash){const id=decodeURIComponent(location.hash.slice(1));const i=clips.findIndex(c=>String(c.id)===id);if(i>=0)requestAnimationFrame(()=>FEED.querySelectorAll(".slide")[i]?.scrollIntoView())}}catch(e){console.warn(e);empty()}})();
</script></body></html>
